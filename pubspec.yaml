  flutter_inappwebview_android: 1.2.0-beta.3
  razorpay_flutter: ^1.4.5
  flutter_dotenv: ^6.0.1
  google_maps_flutter: ^2.18.0
  geocoding: ^5.0.0
  geolocator: ^14.0.3
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# ✅ Flutter Launcher Icons Configuration (Moved OUTSIDE the flutter section)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/AppLogoo/AppLogo.PNG"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/AppLogoo/AppLogo.PNG"
  remove_alpha_ios: true
  min_sdk_android: 21

